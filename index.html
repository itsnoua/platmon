<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>امتثال المباني في مشاريع تحسين الطرق ذات الأولوية</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

  <!-- Google Fonts: Cairo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body,
    html {
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: 'Cairo', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #090d16;
      color: #f8fafc;
    }

    #map {
      height: 100%;
      width: 100%;
      z-index: 1;
      background: #090d16;
    }

    /* Translucent Frosted Gray Glass Badge */
    .map-badge {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: rgba(30, 41, 59, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 18px;
      padding: 14px 26px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
      pointer-events: auto;
      transition: all 0.3s ease;
      text-align: center;
    }

    .map-badge:hover {
      background: rgba(30, 41, 59, 0.88);
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateX(-50%) translateY(-2px);
    }

    .map-badge h1 {
      font-size: 1.15rem;
      font-weight: 800;
      color: #ffffff !important;
      line-height: 1.3;
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: -0.3px;
      white-space: nowrap;
    }

    .map-badge p {
      font-size: 0.85rem;
      color: #ffffff !important;
      margin-top: 4px;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      opacity: 0.95;
    }

    .map-badge p span.dot {
      color: rgba(255, 255, 255, 0.5);
    }

    /* Clean, Eye-friendly Road Paths */
    path.leaflet-interactive {
      stroke-linecap: round;
      stroke-linejoin: round;
      cursor: pointer;
      transition: stroke-width 0.2s ease, stroke-opacity 0.2s ease;
      filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.75));
    }

    path.leaflet-interactive:hover {
      filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.95)) !important;
      stroke-opacity: 1 !important;
    }

    /* White terminal line cap (خط أبيض لبداية ونهاية الشارع) */
    .terminal-line-icon {
      background: transparent !important;
      border: none !important;
      display: flex !important;
      align-items: center;
      justify-content: center;
    }

    .white-terminal-bar {
      width: 15px;
      height: 3px;
      background-color: #ffffff;
      border-radius: 2px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.95), 0 0 1px rgba(0, 0, 0, 0.8);
      cursor: pointer;
      transition: transform 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
    }

    .terminal-line-icon:hover .white-terminal-bar {
      background-color: #f8fafc;
      transform: scale(1.3) !important;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 1), 0 0 4px #ffffff !important;
    }

    /* Modern Hover Floating Tooltip */
    .modern-street-tooltip {
      background: rgba(30, 41, 59, 0.78) !important;
      backdrop-filter: blur(16px) !important;
      -webkit-backdrop-filter: blur(16px) !important;
      border: 1px solid rgba(255, 255, 255, 0.2) !important;
      border-radius: 12px !important;
      color: #ffffff !important;
      font-family: 'Cairo', sans-serif !important;
      font-size: 0.88rem !important;
      font-weight: 700 !important;
      padding: 6px 14px !important;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5) !important;
      direction: rtl !important;
    }

    .modern-street-tooltip::before {
      display: none !important;
    }

    /* Custom Leaflet Popup Styling (Translucent Frosted Gray Glass) */
    .leaflet-popup-content-wrapper {
      background: rgba(30, 41, 59, 0.75) !important;
      backdrop-filter: blur(20px) !important;
      -webkit-backdrop-filter: blur(20px) !important;
      border: 1px solid rgba(255, 255, 255, 0.18) !important;
      border-radius: 20px !important;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7) !important;
      font-family: 'Cairo', sans-serif !important;
      direction: rtl !important;
      padding: 6px !important;
      color: #ffffff !important;
    }

    .leaflet-popup-tip {
      background: rgba(30, 41, 59, 0.75) !important;
      border: 1px solid rgba(255, 255, 255, 0.18) !important;
    }

    .leaflet-popup-content {
      margin: 14px 18px !important;
      line-height: 1.5;
    }

    .popup-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
    }

    .popup-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: #ffffff !important;
      line-height: 1.3;
    }

    .city-badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      border-radius: 9999px;
      font-size: 0.76rem;
      font-weight: 700;
      white-space: nowrap;
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #ffffff !important;
    }

    /* Prominent Street Length Highlight Box */
    .length-metric-card {
      margin: 10px 0 12px 0;
      padding: 10px 14px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      background: rgba(30, 41, 59, 0.65) !important;
      backdrop-filter: blur(12px) !important;
      -webkit-backdrop-filter: blur(12px) !important;
      border: 1px solid rgba(255, 255, 255, 0.18);
    }

    .length-metric-label {
      font-size: 0.88rem;
      font-weight: 700;
      color: #ffffff !important;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .length-metric-value {
      font-size: 1.18rem;
      font-weight: 800;
      letter-spacing: -0.2px;
      font-variant-numeric: tabular-nums;
    }

    .popup-body {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .popup-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      font-size: 0.88rem;
    }

    .popup-row span.label {
      color: #ffffff !important;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      opacity: 0.9;
    }

    .popup-row span.value {
      font-weight: 700;
      color: #ffffff !important;
      font-variant-numeric: tabular-nums;
    }

    /* Inspectors section inside popup */
    .inspectors-section {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
    }

    .inspectors-title {
      font-size: 0.84rem;
      color: #ffffff !important;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .inspectors-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .inspector-item {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(30, 41, 59, 0.6) !important;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.85rem;
      color: #ffffff !important;
      font-weight: 700;
    }

    .inspector-num {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.74rem;
      color: #ffffff !important;
      font-weight: 800;
      flex-shrink: 0;
    }

    .leaflet-container a.leaflet-popup-close-button {
      color: #ffffff !important;
      padding: 8px !important;
      top: 8px !important;
      left: 8px !important;
      right: auto !important;
      opacity: 0.85;
    }

    .leaflet-container a.leaflet-popup-close-button:hover {
      color: #ffffff !important;
      opacity: 1;
    }

    /* Dark Modern Controls (Translucent Gray Glass) */
    .leaflet-control-zoom {
      border: 1px solid rgba(255, 255, 255, 0.16) !important;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4) !important;
      border-radius: 14px !important;
      overflow: hidden;
      background: transparent !important;
    }

    .leaflet-control-zoom a {
      background-color: rgba(30, 41, 59, 0.75) !important;
      backdrop-filter: blur(14px) !important;
      -webkit-backdrop-filter: blur(14px) !important;
      color: #ffffff !important;
      border: none !important;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15) !important;
      transition: all 0.2s ease;
    }

    .leaflet-control-zoom a:hover {
      background-color: rgba(30, 41, 59, 0.9) !important;
      color: #ffffff !important;
    }

    .leaflet-control-layers {
      background: rgba(30, 41, 59, 0.75) !important;
      backdrop-filter: blur(16px) !important;
      -webkit-backdrop-filter: blur(16px) !important;
      border: 1px solid rgba(255, 255, 255, 0.16) !important;
      border-radius: 16px !important;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45) !important;
      color: #ffffff !important;
      font-family: 'Cairo', sans-serif !important;
      padding: 10px 14px !important;
      font-size: 0.86rem !important;
    }

    .leaflet-control-layers-toggle {
      filter: invert(1) brightness(1.5);
    }

    /* Building Marker Pin Styles */
    .building-div-icon {
      background: transparent !important;
      border: none !important;
      display: flex !important;
      align-items: center;
      justify-content: center;
    }

    .building-pin-card {
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1.5px solid #00843D;
      border-radius: 10px;
      padding: 4px 8px;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6), 0 0 10px rgba(0, 132, 61, 0.35);
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
      white-space: nowrap;
    }

    .building-pin-card:hover {
      transform: scale(1.12);
      background: rgba(30, 41, 59, 0.95);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.8), 0 0 18px rgba(0, 132, 61, 0.6);
      border-color: #ffffff;
    }

    .building-pin-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
    }

    .building-pin-badge {
      background: #00843D;
      color: #ffffff !important;
      font-size: 0.78rem;
      font-weight: 800;
      border-radius: 6px;
      padding: 1px 6px;
      line-height: 1.3;
      letter-spacing: -0.2px;
    }

    /* Building Popup Image & Actions Styles */
    .building-popup-img-wrap {
      position: relative;
      width: 100%;
      height: 170px;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      cursor: pointer;
      background: #090d16;
    }

    .building-popup-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s ease, filter 0.3s ease;
    }

    .building-popup-img-wrap:hover .building-popup-img {
      transform: scale(1.05);
      filter: brightness(0.9);
    }

    .building-zoom-btn {
      position: absolute;
      top: 8px;
      left: 8px;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: rgba(30, 41, 59, 0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
      transition: all 0.2s ease;
      pointer-events: none;
    }

    .building-popup-img-wrap:hover .building-zoom-btn {
      background: #00843D;
      border-color: #ffffff;
      transform: scale(1.1);
    }

    .phone-badge-link {
      background: rgba(0, 132, 61, 0.25);
      color: #ffffff !important;
      border: 1px solid #00843D;
      padding: 3px 10px;
      border-radius: 8px;
      font-weight: 700;
      text-decoration: none;
      font-size: 0.86rem;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s ease;
    }

    .phone-badge-link:hover {
      background: #00843D;
      color: #ffffff !important;
      box-shadow: 0 0 10px rgba(0, 132, 61, 0.5);
    }

    .google-maps-btn {
      display: block;
      text-align: center;
      margin-top: 12px;
      background: rgba(104, 59, 137, 0.3);
      border: 1px solid #683B89;
      color: #ffffff !important;
      padding: 8px 14px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.84rem;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    /* Collapsible Municipalities Card */
    .muni-card {
      position: absolute;
      top: 24px;
      right: 24px;
      z-index: 1000;
      background: rgba(30, 41, 59, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 18px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
      width: 260px;
      overflow: hidden;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      font-family: 'Cairo', sans-serif;
      direction: rtl;
    }

    .muni-card-header {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
      background: rgba(30, 41, 59, 0.5);
      transition: background 0.2s ease;
    }

    .muni-card-header:hover {
      background: rgba(30, 41, 59, 0.85);
    }

    .muni-header-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.92rem;
      font-weight: 800;
      color: #ffffff;
    }

    .muni-header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .muni-total-badge {
      background: rgba(0, 132, 61, 0.3);
      border: 1px solid #00843D;
      color: #ffffff;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 6px;
    }

    .muni-chevron-icon {
      transition: transform 0.3s ease;
    }

    .muni-card.collapsed .muni-chevron-icon {
      transform: rotate(180deg);
    }

    .muni-card-body {
      max-height: 400px;
      opacity: 1;
      transition: max-height 0.35s ease, opacity 0.3s ease, padding 0.35s ease;
      padding: 10px 14px 14px 14px;
    }

    .muni-card.collapsed .muni-card-body {
      max-height: 0;
      opacity: 0;
      padding: 0 14px;
      pointer-events: none;
    }

    .muni-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .muni-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 7px 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .muni-item:hover {
      background: rgba(30, 41, 59, 0.95);
      border-color: rgba(255, 255, 255, 0.3);
      transform: translateX(-3px);
    }

    .muni-item-name {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.86rem;
      font-weight: 700;
      color: #ffffff;
    }

    .muni-item-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .muni-item-count {
      font-size: 0.82rem;
      font-weight: 800;
      color: #ffffff;
      padding: 2px 8px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.12);
    }
  </style>
</head>

<body>

  <!-- Minimal floating title badge -->
  <div class="map-badge" id="map-info-badge">
    <h1>امتثال المباني في مشاريع تحسين الطرق ذات الأولوية</h1>
    <p id="total-streets-text">منطقة عسير</p>
  </div>

  <!-- Collapsible Municipalities Card (كارد عدد الشوارع في كل بلدية) -->
  <div class="muni-card" id="muni-stats-card">
    <div class="muni-card-header" id="muni-card-toggle" onclick="toggleMuniCard()">
      <div class="muni-header-title">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#00843D" stroke-width="2.2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        <span> البلديات</span>
      </div>
      <div class="muni-header-actions">
        <svg class="muni-chevron-icon" id="muni-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none"
          stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </div>
    </div>
    <div class="muni-card-body" id="muni-card-body">
      <div class="muni-list" id="muni-list-container"></div>
    </div>
  </div>

  <!-- Map container -->
  <div id="map"></div>

  <!-- Street GeoJSON Data -->
  <script src="streets.js"></script>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <script>
    // Initialize map
    const map = L.map('map', {
      zoomControl: true,
      attributionControl: true
    }).setView([18.22, 42.50], 12);

    // Base layers
    const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles &copy; Esri',
      maxZoom: 19
    }).addTo(map);

    // Satellite place labels & boundaries overlay
    const satelliteLabels = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19
    }).addTo(map);

    // Standard street basemap option
    const osmStreet = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors',
      maxZoom: 19
    });

    // Terminal markers layer group
    const terminalsLayer = L.layerGroup().addTo(map);

    // Buildings and facilities layer group
    const buildingsLayer = L.layerGroup().addTo(map);

    // Layer switcher control (top-left)
    L.control.layers({
      'قمر صناعي (ستالايت)': satellite,
      'خريطة شوارع': osmStreet
    }, {
      'أسماء الأماكن والحدود': satelliteLabels,
      'خطوط بداية ونهاية الشوارع': terminalsLayer,
      'المباني والمنشآت': buildingsLayer
    }, { position: 'topleft' }).addTo(map);

    // Calculate perpendicular angle for terminal white lines
    function getTerminalAngle(pt, allLines) {
      if (!allLines || allLines.length === 0) return 0;
      for (const line of allLines) {
        if (!line || line.length < 2) continue;
        const first = line[0];
        const last = line[line.length - 1];

        const dFirst = Math.hypot(first[0] - pt[0], first[1] - pt[1]);
        if (dFirst < 0.0001) {
          const dx = (line[1][0] - first[0]) * Math.cos(first[1] * Math.PI / 180);
          const dy = -(line[1][1] - first[1]);
          return Math.atan2(dy, dx) * 180 / Math.PI + 90;
        }

        const dLast = Math.hypot(last[0] - pt[0], last[1] - pt[1]);
        if (dLast < 0.0001) {
          const prev = line[line.length - 2];
          const dx = (last[0] - prev[0]) * Math.cos(last[1] * Math.PI / 180);
          const dy = -(last[1] - prev[1]);
          return Math.atan2(dy, dx) * 180 / Math.PI + 90;
        }
      }
      return 0;
    }

    // Create perpendicular white bar marker icon
    function createWhiteLineIcon(angleDeg) {
      return L.divIcon({
        className: 'terminal-line-icon',
        html: `<div class="white-terminal-bar" style="transform: rotate(${Math.round(angleDeg)}deg);"></div>`,
        iconSize: [20, 20],
        iconAnchor: [10, 10]
      });
    }

    // Authorized Saudi National Theme Palette (Saudi Flag Green & Royal Saudi Lavender)
    function getCityTheme(city) {
      // Saudi Flag Green: #00843D
      // Royal Saudi Lavender: #683B89
      if (!city) return { color: '#683B89', bg: 'rgba(104, 59, 137, 0.25)', name: 'غير محدد' };
      if (city.includes('أبها')) {
        return { color: '#00843D', bg: 'rgba(0, 132, 61, 0.25)', name: 'أبها' }; // Saudi Flag Green
      }
      if (city.includes('خميس مشيط')) {
        return { color: '#683B89', bg: 'rgba(104, 59, 137, 0.25)', name: 'خميس مشيط' }; // Royal Saudi Lavender
      }

      if (!coordinates || coordinates.length < 2) return '0.00 كم';
      let totalMeters = 0;
      for (let i = 0; i < coordinates.length - 1; i++) {
        const pt1 = L.latLng(coordinates[i][1], coordinates[i][0]);
        const pt2 = L.latLng(coordinates[i + 1][1], coordinates[i + 1][0]);
        totalMeters += pt1.distanceTo(pt2);

      return (totalMeters / 1000).toFixed(2) + ' كم';

      if (!window.STREETS_DATA || !geojsonLayer) return;
      const targetBounds = L.latLngBounds([]);

            }
          }
        }
      });
      if (targetBounds.isValid()) {
        map.fitBounds(targetBounds, { padding: [50, 50] });
      }
